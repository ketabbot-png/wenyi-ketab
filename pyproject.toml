[project]
name = "trans-novel"
dynamic = ["version"]
description = "A multi-agent long-form novel translation system with context, terminology, polishing, and review."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",        # OpenAI-compatible API calls (e.g., DeepSeek)
    "pydantic>=2.7",       # Data model and configuration validation
    "pyyaml>=6.0",         # Read config.yaml
    "tenacity>=8.2",       # Automatic retry and exponential backoff for LLM calls
    "beautifulsoup4>=4.12", # Extract body text blocks from EPUB
    "httpx>=0.27",         # HTTP client for PDF conversion service
    "lxml>=5.0",           # XHTML parser backend for BeautifulSoup
    "ebooklib>=0.18",      # EPUB read and write
    "typer>=0.12",         # CLI framework
    "rich>=13.7",          # Rich terminal output (tables, progress bars)
    "json-repair>=0.61,<1", # Local repair of malformed JSON from Reviewer
    "pypdf>=6.14.2",
    "google-genai>=2.13.0",
    "python-bidi>=0.4.2",   # BiDi text handling for multilingual output
]

[project.optional-dependencies]
pdf-output = [
    "weasyprint>=69.0",
]
pdf-output-lite = [
    "fpdf2>=2.8.5",
]
word-output = [
    "python-docx>=0.8.11",  # Word (.docx) output with BiDi support
]

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import ordering
select = ["E", "W", "F", "I"]
# Long lines mainly contain Chinese prompt literals which formatter won't split
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
trans-novel = "trans_novel.cli.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["trans_novel"]
