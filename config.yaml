# trans-novel کنفیگ‌ (رمان‌های چند‌زبانی → چینی)
# پس از تغییر نیازی به تغییر کد نیست؛ تمام تنظیمات ارائه‌دهنده مدل، خط‌لوله و خروجی در اینجا است.

language:
  source: auto # auto - زبان مبدا توسط مدل تشخیص داده می‌شود؛ یا می‌توانید کدهایی مانند ja / en / ko / ru / de را ثابت کنید
  target: zh # زبان ترجمه

# ── LLM ─────────────────────────────────────────────────────────────
llm:
  # deepseek | openai | openrouter | openai-compatible | ollama | vllm | fake
  provider: deepseek
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  timeout: 600
  max_retries: 4 # تعداد تکرارهای خرابی موقت که Wenyi انجام می‌دهد؛ تکرار داخلی SDK غیرفعال است
  tiers:
    strong:
      model: deepseek-v4-flash
      options:
        thinking: true
        reasoning_effort: max
    cheap:
      model: deepseek-v4-flash
      options:
        thinking: true
        reasoning_effort: high
    fast:
      model: deepseek-v4-flash
      options:
        thinking: true

# ── تقسیم‌بندی ─────────────────────────────────────────────────────────
segment:
  # اندازه هدف یک دسته ترجمه (گروه جملات) که بر اساس تعداد کاراکترها تخمین زده می‌شود
  max_chars_per_batch: 1800
  # هنگامی که یک پاراگراف از این طول بیشتر است، بر اساس نقطه‌های انتهایی جمله تقسیم می‌شود (پاره‌های ادامه پذیر در پاراگراف مشابه بازگردانده می‌شوند)، تا از پاراگراف‌های بیش از حد طولانی اجتناب شود
  max_chars_per_segment: 1200

# ── سوئیچ‌های خط‌لوله (تعادل کیفیت/هزینه) ────────────────────────────
pipeline:
  review: false # به طور پیش‌فرض غیرفعال است؛ هنگام فعال‌کردن، پس از اتمام ترجمه تمام کتاب، بازبینی نهایی خودکار اجرا می‌شود
  align_retry_limit: 2
  polish: true # صیقل (حالت قوی): برابر با ترجمه مجدد تمام کتاب توسط pro، بسیار گران است؛ به طور پیش‌فرض فعال
  backtranslate_sample: 0 # نسبت نمونه‌برداری ترجمه معکوس (0 = غیرفعال)
  rolling_context_segments: 6 # تعداد بخش‌های متن ترجمه‌شده قبلی که تزریق می‌شوند
  book_understanding:
    true # پیش‌سازی از متن مبدا قبل از ترجمه، ایجاد مرور کل کتاب + خلاصه فصل‌های ترجمه‌شده (به ترجمه‌کننده اطلاع کامل از کل کتاب بدهید)؛
    # حالت fast بدون تفکر، مرور کل کتاب یک پیشوند ثابت است که می‌تواند cache را برای استفاده مجدد کامل کند؛ خاموش کردن هزینه پیش‌سازی را صرفه‌جویی می‌کند
  prescan_concurrency: 4 # تعداد نخ‌های همزمان برای پیش‌سازی خلاصه‌های فصل (هر فصل مستقل است، 1 = سریال)
  annotation_alignment: true # پس از اتمام ترجمه هر بخش منطقی حاوی حاشیه‌نویسی، پیوند‌ها را به صورت سریال تراز کنید؛ هنگام غیرفعال‌کردن فقط متن ترجمه‌شده به علامت پایانی بخش تنزل می‌یابد
  annotation_alignment_concurrency: 4 # هنگامی که تعداد حاشیه‌نویسی در یک بخش منطقی > 1 است، حداکثر تعداد همزمان برای درخواست‌های تراز درخواست موازی (کاهش نرخ بازگشت پاراگراف‌های چند حاشیه‌نویسی)
  review_concurrency: 4 # تعداد بخش‌های همزمان برای بازبینی نهایی (فقط خواندن متن ترجمه‌شده نهایی/لحظه‌ای اصطلاحات، 1 = سریال)
  review_output_retries: 2 # تعداد تکرارهای اضافی هنگام خروجی بازبینی بخش نامعتبر (اولی + 2 = حداکثر 3 بار)
  review_agent_loop: true # پس از یافتن نامزد در بازبینی اول، استفاده از حالت قوی برای درخواست انتخابی شواهد و بازنگری
  review_agent_tier: strong # Tier مدل مورد استفاده در Agent Loop بازبینی و میانجیگری تضاد کل کتاب
  review_agent_max_evidence_rounds: 2 # حداکثر دو دور انتخابی شواهد، سپس باید تصمیم نهایی صادر شود
  review_conflict_arbitration: true # پس از اتمام تمام بخش‌های بازبینی، برای پیشنهادات متناقض یکپارچه‌سازی دوباره‌ای نهایی انجام دهید
  review_fix_loop: true # فقط در متن ترجمه‌ای موقت حافظه تغیر دهید و بدون بازنویسی متن رسمی، نظارت کنید
  review_fix_max_rounds: 2 # حداکثر دو دور جایگزین موقت ایجاد کنید؛ تعداد دور بازبینی کامل تحت تأثیر تایید پیوسته تمیز قرار دارد
  review_clean_confirmations: 2 # دو دور متوالی بدون مشکل یافت شده، متن ترجمه‌ای موقت را تایید شده در نظر بگیرید
  glossary_scope: chapter # chapter = فقط واژه‌هایی که در این فصل ظاهر می‌شوند (کتاب‌های طولانی token‌ها را ذخیره می‌کند)؛ full = جدول کامل

# ── استراتژی احترام (زمانی که متن مبدا ژاپنی است، سایر زبان‌ها معمولاً از آن استفاده نمی‌کنند) ────
honorifics:
  # keep_style: لهجه را منعکس کنید (کارشناس/مصغر/شما...); normalize: طبق قوانین یکسان; drop: حذف کنید
  strategy: keep_style

# ── نرمال‌سازی علائم نقطه‌گذاری (یکی شده برای علائم کوچک و بزرگ سنتی چینی ساده‌شده) ────────────────
punctuation:
  normalize: true

# ── مسیرها ──────────────────────────────────────────────────────────
paths:
  state_dir: state # وضعیت اجرا، محصولات میانی فصل‌ها، اصطلاحات

# ── خروجی دو‌زبانی ─────────────────────────────────────────────────────
output:
  mono: true            # متن تک‌زبانی چینی را خروجی دهید
  bilingual: false      # متن دو‌زبانی را خروجی دهید (متن اصلی محو شده، مقابل ترجمه)
  bilingual_order: target_first  # target_first = ترجمه در بالا متن اصلی در پایین; source_first = متن اصلی در بالا
  bilingual_preserve_source_style: false # true = متن اصلی سبک کتاب اصلی را به ارث می‌برد؛ false = رنگ خاکستری محو شده است
  about_page: true      # صفحه توضیح "درباره این ترجمه" را در انتهای کتاب ضمیمه کنید
